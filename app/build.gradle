plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // 静态检查（detekt）：现有违规进 app/detekt-baseline.xml，只卡新增。
    // 配置集中在根目录 detekt.yml，说明见 tools/quality/README.md。
    // 注意：本插件不会挂到 check/assemble 链路，发版构建不受影响。
    id 'io.gitlab.arturbosch.detekt'
}

int betaVer = 0 //如果为0则是正式版

android {

    namespace 'com.RobinNotBad.BiliClient'
    //noinspection GradleDependency
    compileSdk 33

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
            java {
                exclude '**/GeetestUtil.java'
            }
        }
    }

    defaultConfig {
        applicationId "com.RobinNotBad.BiliClient"
        // Android 10 (API 29)：不再支持更旧系统
        minSdk 29
        // Android 11 (API 30)：利用新特性（分区存储、单次授权、包可见性、
        // 自动深色模式等）。代码内未查询第三方包，故包可见性无兼容问题。
        //noinspection ExpiredTargetSdkVersion
        targetSdk 30
        versionCode 20261030
        versionName "5.0.3"

        if (betaVer) {
            versionName += "-BETA" + betaVer
        }

        multiDexEnabled false

        ndk {
            // Android 11 已移除 mips 支持，且仓库里 mips 的 .so 一直是 0 字节的空占位，
            // 打包进去只会增加安装体积与校验开销，这里直接去掉（#21）。
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a'
        }

        resConfigs 'zh'
    }

    signingConfigs {
        release {
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists() && new Properties() {{
                load(localProps.newDataInputStream())
            }}.hasProperty("KEY_PATH")) {
                storeFile file(pro.getProperty("KEY_PATH") != null ? pro.getProperty("KEY_PATH") : "key.jks")
                storePassword pro.getProperty("KEY_PASSWORD")
                keyAlias pro.getProperty("ALIAS_NAME")
                keyPassword pro.getProperty("ALIAS_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            buildConfigField "boolean", "LOG_DEBUG", "true"
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists() && new Properties() {{
                load(localProps.newDataInputStream())
            }}.hasProperty("KEY_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }

    kotlinOptions {
        jvmTarget = '1.8' // kotlin编译目标1.8，与AGP 7.3.1及desugaring兼容
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
    }
    buildFeatures {
        viewBinding false
    }
}

// ---------------------------------------------------------------------------
// detekt：新增违规门禁（T2）
//   - buildUponDefaultConfig = true：官方默认规则集全开，本文件只做调参；
//   - baseline：仓库内 app/detekt-baseline.xml 收录“当前已有的全部违规”，
//     基线内的历史问题不再拦，只拦新增（老代码按文件接触时迁移，不做运动式重写）；
//   - 单线程 + 不并行：设备内存紧张，构建统一走 /tmp/bili_build.sh（flock 串行 + Xmx1280m）；
//   - 只分析 app/src/main/java，不含 build/ 产物与生成代码。
// 手动执行：bash /tmp/bili_build.sh :app:detekt
// ---------------------------------------------------------------------------
detekt {
    buildUponDefaultConfig = true
    config.setFrom(files("$rootDir/detekt.yml"))
    baseline = file("$projectDir/detekt-baseline.xml")
    parallel = false
    source.setFrom(files("$projectDir/src/main/java"))
    reports {
        txt.required.set(false)
        xml.required.set(false)
        html.required.set(false)
        sarif.required.set(false)
        md.required.set(false)
    }
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    // Kotlin 编译目标是 1.8（见 android.kotlinOptions），detekt 保持一致
    jvmTarget = '1.8'
    // 单线程兜底：并发分析会导致本机 OOM / 抢占构建锁
    parallel = false
    reports {
        txt.required.set(false)
        xml.required.set(false)
        html.required.set(false)
        sarif.required.set(false)
        md.required.set(false)
    }
}

dependencies {
    //noinspection GradleDependency
    implementation 'com.google.zxing:core:3.3.0'
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.5.1'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.9.0'
    //noinspection GradleDependency
    // #14：okhttp 升级到 4.x（Kotlin 实现，连接复用与弱网表现更好；3.x 已 EOL）
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
    //noinspection GradleDependency
    implementation 'org.jsoup:jsoup:1.10.2'
    //noinspection GradleCompatible
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    // Geetest（目前没用到）
    //implementation 'com.geetest.sensebot:sensebot:4.4.2.1'
    //danmaku
    //implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    //implementation 'com.github.ctiao:ndkbitmap-armv7a:0.9.21'
    //implementation 'com.github.ctiao:ndkbitmap-x86:0.9.21'
    //ijk
    implementation project(path: ':ijkplayer-java')
    implementation project(path: ':DanmakuFlameMaster')
    implementation project(path: ':brotlij')
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    implementation "org.brotli:dec:0.1.2"
    implementation "com.aayushatharva.brotli4j:brotli4j:1.16.0"
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    implementation 'androidx.core:core-ktx:1.8.0'
    // 协程：新代码统一用 kotlinx.coroutines（替代 runOnUiThread / 裸 Thread / Timer）。
    // 1.6.4 是 Kotlin 1.7.x 兼容线（1.7.0+ 需要 Kotlin 1.8，不能用）；工具封装见
    // util/CoroutineScopes.kt，规范见 tools/quality/README.md。
    //noinspection GradleDependency
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
}
